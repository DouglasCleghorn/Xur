name: Xur application
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
      - name: Build and test application
        run: |
          export XUR_DOTNET="$(command -v dotnet)"
          python3 eng/build-app-bundle.py
          dotnet run --project tests/Xur.Unit.Tests -c Release
          python3 tests/Xur.Integration.Tests/bootstrap.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xur-app-x86_64
          path: |
            dist/xur-app-x86_64.tar.gz
            dist/xur-app-x86_64.tar.gz.sha256
