name: Xur application
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
      - name: Build and test application
        run: |
          export XUR_DOTNET="$(command -v dotnet)"
          python3 eng/build-app-bundle.py
          dotnet run --project tests/Xur.Unit.Tests -c Release
          python3 tests/Xur.Integration.Tests/bootstrap.py
      - uses: actions/upload-artifact@v7
        with:
          name: xur-app-x86_64
          path: |
            dist/xur-app-x86_64.tar.gz
            dist/xur-app-x86_64.tar.gz.sha256
