name: Build and publish release
on:
  push:
    branches: [main, release]
  workflow_dispatch:
    inputs:
      build_iso:
        description: Force an installer build (including final media verification)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release'
    uses: ./.github/workflows/checks.yml
  build:
    needs: checks
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    outputs:
      channel: ${{ steps.identity.outputs.channel }}
      version: ${{ steps.identity.outputs.version }}
      build_iso: ${{ steps.iso.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - id: identity
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == main ]]; then channel=nightly; else channel=stable; fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          version=$(python3 eng/release-version.py --channel "$channel")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Select installer build
        id: iso
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ steps.identity.outputs.channel }}
          FORCE_ISO: ${{ inputs.build_iso || false }}
        run: |
          args=()
          if [[ "$FORCE_ISO" == true ]]; then args+=(--force); fi
          python3 eng/ci-iso-gate.py --commit "$GITHUB_SHA" --channel "$RELEASE_CHANNEL" "${args[@]}"
      - name: Prepare native build tools and browser
        run: |
          python3 eng/ci-native.py
          mkdir -p .build/browser .build/downloads
          python3 eng/prepare-npm.py browser
          .build/browser/node_modules/.bin/playwright install --with-deps chromium
          python3 - <<'PY'
          import hashlib,json,pathlib,urllib.request
          lock=json.loads(pathlib.Path('eng/toolchain-lock.json').read_text())['tailscale']
          archive=pathlib.Path('.build/downloads/tailscale.tgz')
          urllib.request.urlretrieve(lock['url'],archive)
          assert hashlib.file_digest(archive.open('rb'),'sha256').hexdigest()==lock['sha256']
          PY
      - name: Test and package unsigned build
        env:
          RELEASE_CHANNEL: ${{ steps.identity.outputs.channel }}
          XUR_INSTALLER_CHANNEL: ${{ steps.identity.outputs.channel }}
        run: |
          export XUR_DOTNET="$(command -v dotnet)"
          bash eng/test-fast.sh
          python3 website/build.py
          node tests/Xur.Integration.Tests/website-ui.cjs
          node tests/Xur.Integration.Tests/website-download.cjs
          node tests/Xur.Integration.Tests/website-accessibility.cjs
          python3 eng/build-app-bundle.py --from-published
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          archive=pathlib.Path('dist/xur-app-x86_64.tar.gz')
          pathlib.Path('dist/build.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'channel':os.environ['RELEASE_CHANNEL'],'sha256':hashlib.file_digest(archive.open('rb'),'sha256').hexdigest(),'contextSha256':hashlib.file_digest(pathlib.Path('.build/context/publish-receipt.json').open('rb'),'sha256').hexdigest(),'checks':'eng/test-fast.sh passed','hardwareTests':'Not run'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ steps.identity.outputs.channel }}-${{ github.sha }}
          compression-level: 0
          retention-days: 7
          path: |
            dist/xur-app-x86_64.tar.gz
            dist/build.json
      - name: Export tested installer context
        if: steps.iso.outputs.build == 'true'
        env:
          RELEASE_CHANNEL: ${{ steps.identity.outputs.channel }}
        run: python3 eng/ci-context.py export --commit "$GITHUB_SHA" --channel "$RELEASE_CHANNEL"
      - uses: actions/upload-artifact@v7
        if: steps.iso.outputs.build == 'true'
        with:
          name: context-candidate-${{ steps.identity.outputs.channel }}-${{ github.sha }}
          compression-level: 0
          retention-days: 1
          path: .build/ci-context/
      - name: Prune superseded channel candidates
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ steps.identity.outputs.channel }}
        run: |
          python3 eng/ci-artifacts.py "$RELEASE_CHANNEL"
          python3 eng/ci-artifacts.py "$RELEASE_CHANNEL" --kind context
      - name: Keep failed-check diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-checks-${{ github.sha }}
          retention-days: 7
          path: .build/fast/
  installer:
    needs: build
    if: needs.build.outputs.build_iso == 'true'
    uses: ./.github/workflows/installer.yml
    permissions:
      contents: read
      actions: write
    with:
      channel: ${{ needs.build.outputs.channel }}
  publish:
    needs: [checks, build, installer]
    if: >-
      ${{ !cancelled() && needs.checks.result == 'success' && needs.build.result == 'success' &&
          (needs.installer.result == 'success' ||
           (needs.installer.result == 'skipped' && needs.build.outputs.build_iso == 'false')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ needs.build.outputs.channel }}
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Download this run's tested candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "release-candidate-$RELEASE_CHANNEL-$GITHUB_SHA" --dir .build/ci-artifact
      - name: Download this run's inspected installer
        if: needs.installer.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "installer-candidate-$RELEASE_CHANNEL-$GITHUB_SHA" --dir .build/ci-installer
      - name: Sign and publish checked build
        env:
          GH_TOKEN: ${{ github.token }}
          XUR_UPDATE_SIGNING_KEY_PEM: ${{ secrets.XUR_UPDATE_SIGNING_KEY_PEM }}
          RELEASE_CHANNEL: ${{ needs.build.outputs.channel }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          INCLUDE_INSTALLER: ${{ needs.installer.result == 'success' }}
        run: |
          test -n "$XUR_UPDATE_SIGNING_KEY_PEM"
          umask 077
          export XUR_UPDATE_SIGNING_KEY="$RUNNER_TEMP/xur-release-key.pem"
          trap 'rm -f "$XUR_UPDATE_SIGNING_KEY"' EXIT
          printf '%s\n' "$XUR_UPDATE_SIGNING_KEY_PEM" > "$XUR_UPDATE_SIGNING_KEY"
          unset XUR_UPDATE_SIGNING_KEY_PEM
          args=()
          if [[ "$INCLUDE_INSTALLER" == true ]]; then args+=(--with-installer); fi
          python3 eng/ci-release.py --channel "$RELEASE_CHANNEL" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" "${args[@]}"
      - name: Remove published candidate from Actions storage
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          python3 eng/ci-artifacts.py "$RELEASE_CHANNEL" --published
          python3 eng/ci-artifacts.py "$RELEASE_CHANNEL" --kind installer --published
          python3 eng/ci-artifacts.py "$RELEASE_CHANNEL" --kind context --published
