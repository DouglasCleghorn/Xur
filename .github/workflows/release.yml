name: Build and approve release
on:
  push:
    branches: [main, release]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    outputs:
      channel: ${{ steps.identity.outputs.channel }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
      - id: identity
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == main ]]; then channel=nightly; else channel=stable; fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          version=$(python3 eng/release-version.py --channel "$channel")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Prepare native build tools and browser
        run: |
          python3 eng/ci-native.py
          mkdir -p .build/browser .build/downloads
          npm install --prefix .build/browser playwright@1.58.2 axe-core@4.13.0
          .build/browser/node_modules/.bin/playwright install --with-deps chromium
          python3 - <<'PY'
          import hashlib,json,pathlib,urllib.request
          lock=json.loads(pathlib.Path('eng/toolchain-lock.json').read_text())['tailscale']
          archive=pathlib.Path('.build/downloads/tailscale.tgz')
          urllib.request.urlretrieve(lock['url'],archive)
          assert hashlib.file_digest(archive.open('rb'),'sha256').hexdigest()==lock['sha256']
          PY
      - name: Test and package unsigned build
        run: |
          export XUR_DOTNET="$(command -v dotnet)"
          bash eng/test-fast.sh
          python3 website/build.py
          node tests/Xur.Integration.Tests/website-ui.cjs
          node tests/Xur.Integration.Tests/website-download.cjs
          node tests/Xur.Integration.Tests/website-accessibility.cjs
          python3 eng/build-app-bundle.py --from-published
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          archive=pathlib.Path('dist/xur-app-x86_64.tar.gz')
          pathlib.Path('dist/build.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'sha256':hashlib.file_digest(archive.open('rb'),'sha256').hexdigest(),'checks':'eng/test-fast.sh passed','hardwareTests':'Not run'},indent=2)+'\n')
          PY
      - name: Prune superseded channel candidates
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ steps.identity.outputs.channel }}
        run: python3 eng/ci-artifacts.py "$RELEASE_CHANNEL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-candidate-${{ steps.identity.outputs.channel }}-${{ github.sha }}
          compression-level: 0
          retention-days: 7
          path: |
            dist/xur-app-x86_64.tar.gz
            dist/build.json
      - name: Keep failed-check diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: failed-checks-${{ github.sha }}
          retention-days: 7
          path: .build/fast/
  installer:
    needs: build
    uses: ./.github/workflows/installer.yml
    permissions:
      contents: read
      actions: write
    with:
      channel: ${{ needs.build.outputs.channel }}
  publish:
    needs: [build, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ needs.build.outputs.channel }}
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download this run's tested candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "release-candidate-$RELEASE_CHANNEL-$GITHUB_SHA" --dir .build/ci-artifact
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "installer-candidate-$RELEASE_CHANNEL-$GITHUB_SHA" --dir .build/ci-installer
      - name: Sign and publish approved build
        env:
          GH_TOKEN: ${{ github.token }}
          XUR_UPDATE_SIGNING_KEY_PEM: ${{ secrets.XUR_UPDATE_SIGNING_KEY_PEM }}
          RELEASE_CHANNEL: ${{ needs.build.outputs.channel }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          test -n "$XUR_UPDATE_SIGNING_KEY_PEM"
          umask 077
          export XUR_UPDATE_SIGNING_KEY="$RUNNER_TEMP/xur-release-key.pem"
          trap 'rm -f "$XUR_UPDATE_SIGNING_KEY"' EXIT
          printf '%s\n' "$XUR_UPDATE_SIGNING_KEY_PEM" > "$XUR_UPDATE_SIGNING_KEY"
          unset XUR_UPDATE_SIGNING_KEY_PEM
          python3 eng/ci-release.py --channel "$RELEASE_CHANNEL" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
      - name: Remove published candidate from Actions storage
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          python3 eng/ci-artifacts.py "$RELEASE_CHANNEL" --published
          python3 eng/ci-artifacts.py "$RELEASE_CHANNEL" --kind installer --published
