name: Source checks
on:
  workflow_call:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Native AOT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev btrfs-progs
      - run: |
          mkdir -p .build/checks
          python3 -m pip install --target .build/checks -r eng/requirements.txt
          PYTHONPATH=.build/checks python3 eng/check-dependency-coverage.py
          PYTHONPATH=.build/checks python3 tests/Xur.Integration.Tests/dependency-coverage.py
          python3 eng/check-web-assets.py
          python3 tests/Xur.Integration.Tests/web-assets.py
          dotnet run --project tests/Xur.Unit.Tests -c Release
          XUR_DOTNET="$(command -v dotnet)" PYTHONPYCACHEPREFIX=.build/checks/pycache python3 tests/Xur.Integration.Tests/gr00t-preparation.py
          XUR_CONTROL_BINARY="$PWD/src/Xur.Control/bin/Release/net10.0/Xur.Control" python3 tests/Xur.Integration.Tests/browser-sessions.py
          XUR_DOTNET="$(command -v dotnet)" python3 tests/Xur.Integration.Tests/profile-access.py
          python3 tests/Xur.Integration.Tests/desktop-timezone.py
          python3 tests/Xur.Integration.Tests/os-update.py
          python3 tests/Xur.Integration.Tests/network-startup.py
          XUR_DOTNET="$(command -v dotnet)" python3 tests/Xur.Integration.Tests/console-menu.py
          dotnet build src/Xur.Gateway -c Release
          XUR_DOTNET="$(command -v dotnet)" dotnet run --project tests/Xur.Profile.Tests -c Release
          python3 tests/Xur.Integration.Tests/application-update.py
          mkdir -p .build
          python3 tests/Xur.Integration.Tests/compact-update.py
          python3 tests/Xur.Integration.Tests/compact-release.py
          python3 tests/Xur.Integration.Tests/steam-storage.py
          XUR_DOTNET="$(command -v dotnet)" bash eng/test-xurutil.sh
          sudo bash eng/test-steam-btrfs.sh
          sudo env XUR_UTIL="$PWD/.build/xurutil/xurutil" python3 tests/Xur.Integration.Tests/streaming-access.py
          python3 tests/Xur.Integration.Tests/online-installer.py
          python3 tests/Xur.Integration.Tests/installer-preflight.py
          python3 tests/Xur.Integration.Tests/install-failure.py
          python3 tests/Xur.Integration.Tests/builder-ready.py
          python3 tests/Xur.Integration.Tests/github-release.py
          python3 tests/Xur.Integration.Tests/release-version.py
          mkdir -p .build
          python3 tests/Xur.Integration.Tests/ci-build.py
          python3 tests/Xur.Integration.Tests/source-manifest.py
          python3 website/build.py
  installer-usb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install FAT32 fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools libarchive-tools xorriso
      - name: Test streaming installer updates on file-backed FAT32 media
        run: |
          mkdir -p .build/usb-update/tmp
          sudo env TMPDIR="$PWD/.build/usb-update/tmp" \
            DOTNET_CLI_HOME="$PWD/.build/usb-update/dotnet-home" \
            NUGET_PACKAGES="$PWD/.build/usb-update/packages" \
            NUGET_HTTP_CACHE_PATH="$PWD/.build/usb-update/http-cache" \
            NUGET_SCRATCH="$PWD/.build/usb-update/nuget-scratch" \
            DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 \
            DOTNET_GENERATE_ASPNET_CERTIFICATE=false \
            "$(command -v dotnet)" run --file tests/Xur.Integration.Tests/update-usb.cs
