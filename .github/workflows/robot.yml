name: Robot nightly container
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'containers/robot/**'
      - 'containers/robot-backup/Shared/**'
      - 'src/Xur.Agent/Robot*'
      - 'src/Xur.Agent/WorkloadRuntime.cs'
      - 'src/Xur.Agent/Program.cs'
      - 'src/Xur.Control/Robot*'
      - 'src/Xur.Control/Program.cs'
      - 'src/Xur.Domain/Robot*'
      - 'tools/Xur.Robotics/**'
      - 'tests/Xur.Integration.Tests/robot-web.py'
      - 'tests/Xur.Integration.Tests/robot-metrology-native.py'
      - 'tests/Xur.Integration.Tests/robot-metrology-web.py'
      - 'tests/Xur.Unit.Tests/RoboticsTests.cs'
      - 'tests/Xur.Robot.Tests/**'
      - 'tests/Xur.Integration.Tests/robot-boundary.py'
      - 'tests/Xur.Integration.Tests/robotics-tools.py'
      - '.github/workflows/robot.yml'
      - 'Directory.Build.props'
      - 'global.json'
      - 'eng/source_files.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: robot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Check robotics integration
        run: |
          dotnet run --project tests/Xur.Unit.Tests -c Release -- --robotics
          dotnet run --project tests/Xur.Robot.Tests -c Release
          python3 tests/Xur.Integration.Tests/robot-boundary.py
          PYTHONPYCACHEPREFIX=.build/robot/pycache python3 tests/Xur.Integration.Tests/robotics-bridge.py
          python3 eng/check-web-assets.py
      - name: Build Native AOT container
        run: >-
          docker build --file containers/robot/Containerfile
          --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          --tag "localhost/xur-robot-test:$GITHUB_SHA" .
      - name: Validate installed upstream robotics tools without hardware
        run: |
          mkdir -p .build/robot/tool-state
          # Match the appliance's private root-owned state with capabilities dropped.
          sudo chown 0:0 .build/robot/tool-state
          sudo chmod 700 .build/robot/tool-state
          docker run --rm --pull=never --network=none --cap-drop=ALL \
            --security-opt=no-new-privileges --read-only --memory=4g --pids-limit=256 \
            --tmpfs=/tmp:rw,nosuid,nodev,size=128m \
            --volume "$PWD/.build/robot/tool-state:/state:rw" \
            --volume "$PWD/tests/Xur.Integration.Tests/robotics-tools.py:/test/robotics-tools.py:ro" \
            --entrypoint python "localhost/xur-robot-test:$GITHUB_SHA" /test/robotics-tools.py
      - name: Test the exact container with isolated mock hardware
        # Exercise the independent app with container-local fake subprocess tools.
        # No agent socket, physical devices or container-engine socket enter it.
        run: sudo python3 tests/Xur.Integration.Tests/robot-web.py --container "localhost/xur-robot-test:$GITHUB_SHA" --engine docker
      - name: Validate metric marker estimation without hardware
        run: |
          mkdir -p .build/evidence/metrology
          docker run --rm --pull=never --network=none --cap-drop=ALL \
            --security-opt=no-new-privileges --read-only --memory=512m --pids-limit=128 \
            --tmpfs=/tmp:rw,nosuid,nodev,size=32m \
            --volume "$PWD/tests/Xur.Integration.Tests/robot-metrology-native.py:/test/native.py:ro" \
            --volume "$PWD/.build/evidence/metrology:/evidence:rw" \
            --entrypoint python "localhost/xur-robot-test:$GITHUB_SHA" \
            /test/native.py --evidence /evidence/native-proof.json
          sudo python3 tests/Xur.Integration.Tests/robot-metrology-web.py \
            --container "localhost/xur-robot-test:$GITHUB_SHA" --engine docker
      - name: Preserve container test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-validation-${{ github.run_id }}
          path: |
            .build/evidence/robot-web/
            .build/evidence/metrology/
          retention-days: 7
      - name: Save tested image for publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p .build/robot
          docker save "localhost/xur-robot-test:$GITHUB_SHA" | gzip > .build/robot/image.tar.gz
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: robot-candidate-${{ github.sha }}
          path: .build/robot/image.tar.gz
          compression-level: 0
          retention-days: 1
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: nightly
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download this run's tested candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "robot-candidate-$GITHUB_SHA" --dir .build/robot
      - name: Publish tested nightly to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/xur-robot"
          gzip -dc .build/robot/image.tar.gz | docker load
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "localhost/xur-robot-test:$GITHUB_SHA" "$image:nightly"
          docker tag "localhost/xur-robot-test:$GITHUB_SHA" "$image:sha-$GITHUB_SHA"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:nightly"
          docker logout ghcr.io
