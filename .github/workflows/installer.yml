name: Build installer candidate
on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
permissions:
  contents: read
jobs:
  installer:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    env:
      XUR_BUILDER_CPUS: '4'
      XUR_BUILDER_MEMORY: '8192'
      XUR_INSTALLER_CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare disposable hosted runner
        run: |
          export XUR_BUILD_ROOT="$RUNNER_TEMP/xur-iso-build"
          export XUR_BUILD_CACHE="$RUNNER_TEMP/xur-iso-cache"
          echo "XUR_BUILD_ROOT=$XUR_BUILD_ROOT" >> "$GITHUB_ENV"
          echo "XUR_BUILD_CACHE=$XUR_BUILD_CACHE" >> "$GITHUB_ENV"
          bash eng/ci-iso-prepare.sh
      - name: Download this run's tested publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "context-candidate-$XUR_INSTALLER_CHANNEL-$GITHUB_SHA" --dir .build/ci-context
      - name: Identify Fedora toolchain cache
        id: toolchain
        run: echo "key=$(python3 eng/ci-builder-cache.py key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: .build/fedora-toolchain/
          key: fedora-toolchain-x86_64-${{ steps.toolchain.outputs.key }}
      - name: Prepare or verify Fedora toolchain template
        run: python3 eng/ci-builder-cache.py prepare
      - uses: actions/cache/save@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: .build/fedora-toolchain/
          key: fedora-toolchain-x86_64-${{ steps.toolchain.outputs.key }}
      - name: Build and inspect online installer
        run: |
          bash eng/ci-kvm-access.sh
          export XUR_BUILDER_TEMPLATE="$GITHUB_WORKSPACE/.build/fedora-toolchain"
          ./eng/build-iso.sh --from-tested-context .build/ci-context
          python3 eng/ci-installer.py candidate --commit "$GITHUB_SHA" --channel "$XUR_INSTALLER_CHANNEL"
      - name: Prune superseded installer candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/ci-artifacts.py "$XUR_INSTALLER_CHANNEL" --kind installer
      - uses: actions/upload-artifact@v7
        with:
          name: installer-candidate-${{ inputs.channel }}-${{ github.sha }}
          compression-level: 0
          retention-days: 7
          path: |
            dist/xur-installer-x86_64.iso
            dist/xur-installer-x86_64.embedded.json
            dist/installer-build.json
      - name: Stop disposable builder
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,pathlib,socket
          path=pathlib.Path(os.environ['XUR_BUILD_ROOT'])/'vm/qmp.sock'
          if path.exists():
              with socket.socket(socket.AF_UNIX) as client:
                  client.settimeout(10);client.connect(str(path));stream=client.makefile('rwb');stream.readline()
                  for command in ['qmp_capabilities','quit']:
                      stream.write((json.dumps({'execute':command})+'\n').encode());stream.flush()
                      while True:
                          result=json.loads(stream.readline())
                          if 'return' in result or 'error' in result:break
          PY
  vm:
    needs: installer
    uses: ./.github/workflows/vm-tests.yml
    permissions:
      contents: read
      actions: read
    with:
      candidate_artifact: installer-candidate-${{ inputs.channel }}-${{ github.sha }}
      scenario: all
