# Shared by the ISO's UEFI and BIOS menus. Only completed Xur installs get a marker.
insmod part_gpt
insmod part_msdos
insmod fat
insmod ext2
insmod search_fs_file
set timeout_style=menu
set timeout=10
set default=xur-installer
search --no-floppy --label XUR_SETUP_A --set=xur_media
if search --no-floppy --file --set=xur_installed /xur/installed; then
    if [ -f ($xur_installed)/grub2/grub.cfg ]; then
        set default=xur-installed
        menuentry 'Boot installed Xur' --id=xur-installed {
            set root=$xur_installed
            configfile ($root)/grub2/grub.cfg
        }
    fi
fi
menuentry 'Install or repair Xur' --id=xur-installer {
    set root=$xur_media
    linux /images/pxeboot/vmlinuz inst.stage2=hd:LABEL=XUR_SETUP_A inst.text console=tty1 systemd.unit=multi-user.target xur.installer=1 rd.live.ram=0 rd.lvm=0 rd.md=0 rd.luks=0 rd.dm=0
    initrd /images/pxeboot/initrd.img
}
